[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "shopsense-capstone"
version = "1.0.0"
description = "ShopSense customer care and order operations assistant"
requires-python = ">=3.10"
dependencies = [
    "pandas>=2.0",
    "pydantic>=2.0",
    "fastapi>=0.110",
    "uvicorn[standard]>=0.27",
    "langgraph>=0.2",
    "langgraph-checkpoint-sqlite>=3.1",
    "typing-extensions>=4.8",
    "openai>=1.50",
    "qdrant-client>=1.12",
    "fastembed>=0.5",
    "mcp>=1.12,<2",
    "pypdf>=5",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0",
    "httpx>=0.27",
]

[project.scripts]
shopsense-api = "capstone.api.main:run"
shopsense-mcp = "capstone.mcp.server:run"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
